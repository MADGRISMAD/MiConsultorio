# Production-like stack: PostgreSQL + the Caresia app (API and frontend on :8080).
#   cp .env.example .env   # then set POSTGRES_PASSWORD and JWT_SECRET
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caresia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-caresia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-caresia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-caresia}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Administrador de Caresia}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-plataforma}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      CLINIC_NAME: ${CLINIC_NAME:-Mi Clínica}
      CLINIC_KIND: ${CLINIC_KIND:-GENERAL_MEDICAL}
      CLINIC_ADMIN_NAME: ${CLINIC_ADMIN_NAME:-}
      CLINIC_ADMIN_EMAIL: ${CLINIC_ADMIN_EMAIL:-}
      CLINIC_ADMIN_USERNAME: ${CLINIC_ADMIN_USERNAME:-admin}
      CLINIC_ADMIN_PASSWORD: ${CLINIC_ADMIN_PASSWORD:-}
      APP_URL: ${APP_URL:-}
      SMTP_SERVICE: ${SMTP_SERVICE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
      MP_CURRENCY: ${MP_CURRENCY:-MXN}
      MP_SANDBOX: ${MP_SANDBOX:-false}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_CLIENT_ID: ${MP_CLIENT_ID:-}
      MP_CLIENT_SECRET: ${MP_CLIENT_SECRET:-}
      MP_OAUTH_REDIRECT: ${MP_OAUTH_REDIRECT:-}
      MP_PLAN_BASICO_PRICE: ${MP_PLAN_BASICO_PRICE:-}
      MP_PLAN_CRECIMIENTO_PRICE: ${MP_PLAN_CRECIMIENTO_PRICE:-}
      MP_PLAN_PRO_PRICE: ${MP_PLAN_PRO_PRICE:-}
      MP_PLAN_BASICO_YEAR_PRICE: ${MP_PLAN_BASICO_YEAR_PRICE:-}
      MP_PLAN_CRECIMIENTO_YEAR_PRICE: ${MP_PLAN_CRECIMIENTO_YEAR_PRICE:-}
      MP_PLAN_PRO_YEAR_PRICE: ${MP_PLAN_PRO_YEAR_PRICE:-}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
    # Solo local: delante va un proxy con HTTPS. APP_PORT cambia el puerto si el 8080 está ocupado.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  pgdata:
