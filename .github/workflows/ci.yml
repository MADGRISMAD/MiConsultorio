name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caresia
          POSTGRES_PASSWORD: caresia
          POSTGRES_DB: caresia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caresia" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://caresia:caresia@localhost:5432/caresia_test?sslmode=disable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # El frontend lo publica Vercel (proyecto caresia); aquí se publican la API y PostgreSQL en el VPS.
  deploy-backend:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      HOST: ubuntu@15.235.62.27
    steps:
      - uses: actions/checkout@v4

      - name: Llave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # El .env vive solo en el servidor: no se toca.
      - name: Subir código
        run: rsync -az --delete --exclude .env --exclude .git --exclude node_modules --exclude .claude ./ "$HOST:~/miconsultorio/"

      - name: Reconstruir y arrancar
        run: ssh "$HOST" 'cd ~/miconsultorio && docker compose up -d --build && docker image prune -f'

      - name: Comprobar que responde
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://miconsultorio.15-235-62-27.sslip.io/api/health

  # Avisa por correo cómo terminó el deploy (bien o mal). Si faltan los secretos de correo, no hace nada.
  notify-deploy:
    needs: [deploy-backend]
    if: always() && needs.deploy-backend.result != 'skipped' && needs.deploy-backend.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar correo
        # Un fallo del correo nunca debe pintar de rojo un deploy que salió bien.
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || vars.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM }}
          NOTIFY_TO: ${{ secrets.DEPLOY_NOTIFY_TO || vars.DEPLOY_NOTIFY_TO }}
          RESULT: ${{ needs.deploy-backend.result }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          APP_URL: ${{ vars.APP_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: bash .github/scripts/deploy-mail.sh
